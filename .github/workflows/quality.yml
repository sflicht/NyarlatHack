name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Python lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned linter
        run: python -m pip install ruff==0.15.10
      - name: Check Python
        run: |
          ruff check chaos tests/chaos scripts
          ruff format --check chaos tests/chaos scripts

  game:
    name: Native builds and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential bison flex libncursesw5-dev pkg-config liblua5.4-dev
      - name: Build both modes and run the complete offline suite
        run: |
          set -euo pipefail
          make -j2 install CHAOS=0 2>&1 | tee ci-build-off.log
          stock="$RUNNER_TEMP/nyarlathack-stock"
          mkdir -p "$stock"
          cp dnethackdir/dnethack dnethackdir/nhdat dnethackdir/license "$stock/"
          make -j2 install CHAOS=1 2>&1 | tee ci-build-on.log
          NYARLATHACK_STOCK_DIR="$stock" NYARLATHACK_GAME_TESTS=1 \
            python -m unittest discover -s tests/chaos -p 'test_*.py' -v \
            2>&1 | tee ci-tests.log
      - name: Retain build and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-and-test-logs
          path: ci-*.log
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan all reachable history, including merge diffs
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .github/gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --log-opts='--all --full-history --diff-merges=first-parent' \
            --max-decode-depth 5 --max-archive-depth 2 --timeout 300
