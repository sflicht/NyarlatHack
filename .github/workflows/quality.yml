name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Python lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned linter
        run: python -m pip install ruff==0.15.10
      - name: Check Python
        run: |
          ruff check chaos tests/chaos scripts
          ruff format --check chaos tests/chaos scripts

  game:
    name: Native builds and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gcc-13 binutils bison flex libncursesw5-dev pkg-config liblua5.4-dev
      - name: Prepare authenticated native tuples
        run: |
          set -euo pipefail
          umask 077
          container=$(mktemp -d /tmp/nyarl-native-ci.XXXXXX)
          out="$container/output" # absent; preparer creates it
          printf 'NYARLATHACK_CI_OUT=%s\n' "$out" >> "$GITHUB_ENV"
          /usr/bin/python3 scripts/prepare_native_ci.py \
            --root "$GITHUB_WORKSPACE" --output-dir "$out" \
            --expected-revision "$GITHUB_SHA" 2>&1 | tee "$RUNNER_TEMP/native-preparation.log"
      - name: Run the complete offline suite once
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          revision="$GITHUB_SHA"
          cd "$GITHUB_WORKSPACE"
          umask 077
          out="$NYARLATHACK_CI_OUT"
          invocation=$(mktemp -d "$out/fixtures/full-suite.XXXXXX")
          : > "$out/full-suite.log"
          # Preserve intentionally public negative fixtures inside private TMPDIR.
          umask 022
          env -i PATH=/usr/bin:/bin HOME="$out/home" LANG=C.UTF-8 TZ=America/New_York \
            PKG_CONFIG_LIBDIR=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
            MAIL="$out/MAIL" TMPDIR="$out/fixtures" PYTHONDONTWRITEBYTECODE=1 \
            NYARLATHACK_STOCK_DIR="$out/stock" NYARLATHACK_GAME_TESTS=1 \
            NYARLATHACK_PRECURIO_DIR="$out/precurio" \
            NYARLATHACK_NATIVE_FIXTURE_MODE=source-build \
            NYARLATHACK_NATIVE_BUILD_RECEIPT="$out/system-gcc13" \
            NYARLATHACK_NATIVE_EXPECTED_REVISION="$revision" \
            NYARLATHACK_PLATFORM_ROOT="$root" \
            NYARLATHACK_PLATFORM_RECEIPT="$out/system-gcc13" \
            NYARLATHACK_PLATFORM_REVISION="$revision" \
            NYARLATHACK_PLATFORM_ARTIFACTS="$invocation/platform" \
            NYARLATHACK_PLATFORM_OFF_TUPLE="$out/stock" \
            NYARLATHACK_WHISTLE_ROOT="$root" \
            NYARLATHACK_WHISTLE_RECEIPT="$out/system-gcc13" \
            NYARLATHACK_WHISTLE_REVISION="$revision" \
            NYARLATHACK_WHISTLE_ARTIFACTS="$invocation/whistle" \
            NYARLATHACK_FOUNTAIN_ROOT="$root" \
            NYARLATHACK_FOUNTAIN_RECEIPT="$out/system-gcc13" \
            NYARLATHACK_FOUNTAIN_REVISION="$revision" \
            NYARLATHACK_FOUNTAIN_ARTIFACTS="$invocation/fountain" \
            NYARLATHACK_FOUNTAIN_MATRIX_ARTIFACTS="$invocation/fountain-matrix" \
            NYARLATHACK_ACTION_TRANSPORT_ROOT="$root" \
            NYARLATHACK_ACTION_TRANSPORT_RECEIPT="$out/system-gcc13" \
            NYARLATHACK_ACTION_TRANSPORT_REVISION="$revision" \
            NYARLATHACK_ACTION_TRANSPORT_ARTIFACTS="$invocation/action-transport" \
            /usr/bin/python3 -m unittest discover -s tests/chaos -p 'test_*.py' -v \
            2>&1 | tee "$out/full-suite.log"
      - name: Retain selected preparation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-preparation-log
          path: |
            ${{ runner.temp }}/native-preparation.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain selected build and test diagnostics
        if: ${{ always() && env.NYARLATHACK_CI_OUT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-build-and-test-logs
          path: |
            ${{ env.NYARLATHACK_CI_OUT }}/*.json
            ${{ env.NYARLATHACK_CI_OUT }}/full-suite.log
            ${{ env.NYARLATHACK_CI_OUT }}/system-gcc13/*.json
            ${{ env.NYARLATHACK_CI_OUT }}/system-gcc13/*.log
            ${{ env.NYARLATHACK_CI_OUT }}/system-gcc13/*.txt
            ${{ env.NYARLATHACK_CI_OUT }}/old-on/*.json
            ${{ env.NYARLATHACK_CI_OUT }}/old-on/*.log
            ${{ env.NYARLATHACK_CI_OUT }}/old-on/*.txt
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.json
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.jsonl
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.raw
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.log
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.txt
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.stdout
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.stderr
            ${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/*.bin
            !${{ env.NYARLATHACK_CI_OUT }}/fixtures/**/.git/**
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: Secret history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --max-time 90 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan all reachable history, including merge diffs
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --config .github/gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color \
            --log-opts='--all --full-history --diff-merges=first-parent' \
            --max-decode-depth 5 --max-archive-depth 2 --timeout 300
